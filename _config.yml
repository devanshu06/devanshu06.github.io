title: Devanshu Singh
description: SRE / DevOps Engineer — Reliability, Kubernetes, Automation
url: "https://devanshu06.github.io"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# Author / Personal Info
author:
  name: "Devanshu Singh"
  avatar: "/assets/images/devanshu.jpeg"
  bio: "SRE / DevOps Engineer. Building reliable systems at scale."
  location: "Varanasi, India"
  links:
    - label: "One2N (Remotely)"
      icon: "fas fa-fw fa-building-columns"
      url: "https://one2n.io"
    - label: "GitHub"
      icon: "fa-brands fa-github"
      url: "https://github.com/devanshu06"
    - label: "LinkedIn"
      icon: "fa-brands fa-linkedin"
      url: "https://www.linkedin.com/in/devanshu0611/"
    - label: "X"
      icon: "fa-brands fa-x-twitter"
      url: "https://x.com/mrdev06"
    - label: "Instagram"
      icon: "fa-brands fa-instagram"
      url: "https://www.instagram.com/its.me.devanshu"

# Site Settings
locale: "en-US"
search: true
search_provider: lunr

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/devanshu0611/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/devanshu06"

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
      classes: wide
      author_profile: true
      show_date: true
      share: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      classes: wide
      author_profile: true
      read_time: true
      show_date: true
      share: false
      related: true
  - scope:
      path: ""
    values:
      layout: single
      classes: wide
      author_profile: true

